<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="挑选可爱、文字梗与搞怪表情，组成自己的聊天表情库。"><title>大肥鱼 · Photos</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="gallery.css"><script src="gallery.js" defer></script></head>
<body><header><a class="brand" href="/" aria-label="大肥鱼画廊首页"><img src="favicon.png" width="38" height="38" alt="">大肥鱼 <span>Photos</span></a><button id="help" class="download-pack">怎么导入 <span aria-hidden="true">↗</span></button></header>
<main><section class="hero"><div><h1>挑点表情，<br>聊得有趣<span>。</span></h1><p>把喜欢的，装进自己的表情库。</p></div><div class="hero-art" aria-hidden="true" id="heroArt"></div></section>
<section class="collection" aria-label="表情画廊"><div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="搜台词、心情、角色…" aria-label="搜索台词、情境或作者"></label><button id="shuffle" class="shuffle">随便看看 <span aria-hidden="true">↻</span></button></div><div class="catalog-options"><select id="collection" aria-label="选择图集"><option value="all">全部图集</option></select><select id="emotion" aria-label="选择情绪"><option value="all">全部情绪</option></select><button id="selectVisible">选取当前已显示</button></div><div class="filters" id="filters" aria-label="按风格筛选"></div><p id="status" role="status"></p><div id="gallery" class="gallery"></div><button id="more" class="more" hidden>再看一些 ↓</button></section></main>
<aside id="selectionBar" class="selection-bar" hidden aria-label="已选表情"><span id="selectionCount" role="status"></span><div><button id="clearSelection">清空</button><button id="exportSelection" class="primary">导出导入包 ↓</button></div></aside>
<footer><span>大肥鱼的表情收藏</span><div><a href="CREDITS.txt">素材与署名</a><a href="LICENSES.txt">素材许可</a><a href="https://github.com/SAKURAfan1023/dafeiyu-bot" target="_blank" rel="noreferrer">GitHub ↗</a></div></footer>
<dialog id="viewer" aria-labelledby="viewerTitle"><button id="close" class="close" aria-label="关闭预览">×</button><div class="viewer-image"><button id="previous" aria-label="上一张">‹</button><img id="preview" alt=""><button id="next" aria-label="下一张">›</button></div><div class="viewer-info"><div><h2 id="viewerTitle"></h2><p id="context"></p><p id="credit" class="credit"></p><a id="source" target="_blank" rel="noreferrer">查看来源 ↗</a></div><div class="viewer-actions"><button id="pickPreview">选入资源包</button><a id="download" class="primary" download>下载原图 ↓</a></div></div></dialog>
<dialog id="importGuide" aria-labelledby="guideTitle"><div class="guide-heading"><h2 id="guideTitle">把喜欢的表情带走</h2><button id="closeGuide" class="close" aria-label="关闭导入指南">×</button></div><ol class="import-steps"><li><strong>挑选表情</strong><p>按图集、风格或台词筛选，勾选喜欢的图片。</p></li><li><strong>导出导入包</strong><p>每包最多 50 张，保留情绪、说明与来源。</p></li><li><strong>导入机器人</strong><p>打开大肥鱼面板「范围与回复 → 导入本机表情」，选择下载的 .dafeiyu.json 文件。客户端也可在表情库中导入。</p></li></ol></dialog><div id="toast" role="status"></div>
</body></html>
