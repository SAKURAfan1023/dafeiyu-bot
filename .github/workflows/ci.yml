name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Privacy and public file check
        run: python3 scripts/check-public.py
      - name: Unit and simulated integration tests
        run: bash scripts/test.sh
      - name: Build app
        run: bash scripts/build.sh
      - name: Install dependencies for existing social HTTP checks
        run: |
          echo "DAFEIYU_XHS_RUNTIME_DIR=$RUNNER_TEMP/dafeiyu-social-test" >> "$GITHUB_ENV"
          DAFEIYU_XHS_RUNTIME_DIR="$RUNNER_TEMP/dafeiyu-social-test" bash scripts/setup-social.sh
      - name: Real HTTP control boundary
        run: python3 scripts/test-control-panel.py 'dist/WeChat AI Bot.app/Contents/MacOS/WeChatAIBot'
      - name: QQ isolated artifact and dual entrypoints
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix Resources/QQTransport --ignore-scripts --no-audit --no-fund
          python3 scripts/build-qq.py --configuration debug --test-node-transport
          DAFEIYU_NODE="$(command -v node)" DAFEIYU_RESOURCES="$PWD/dist/qq/Resources" python3 scripts/test-onebot-transport.py dist/qq/dafeiyu-qq
          DAFEIYU_NODE="$(command -v node)" python3 scripts/test-control-panel.py dist/qq/dafeiyu-qq --qq-only
          python3 scripts/build-qq.py --configuration debug
          DAFEIYU_QQ_ROOT="$PWD/dist/qq" npm test
          npm run pack:qq
          npm run test:distribution
      - name: Relocatable macOS MCP test bundle
        run: |
          npm run build:macos-mcp
          npm run test:macos-mcp
