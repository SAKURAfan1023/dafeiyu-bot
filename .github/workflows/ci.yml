name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and public file check
        run: python3 scripts/check-public.py
      - name: Unit and simulated integration tests
        run: bash scripts/test.sh
      - name: Build app
        run: bash scripts/build.sh
